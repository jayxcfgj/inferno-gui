[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferno-gui"
version = "1.0.0"
description = "A Linux desktop tool for managing Inferno Dante/AES67 virtual soundcard with PipeWire"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "jacob", email = "jacob@example.com"}
]
maintainers = [
    {name = "jacob", email = "jacob@example.com"}
]
keywords = ["audio", "dante", "aes67", "ptp", "pipewire", "inferno", "statime", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
inferno-gui = "inferno_gui.main:main"

[project.urls]
Homepage = "https://github.com/teodly/inferno"
Repository = "https://github.com/teodly/inferno"
Issues = "https://github.com/teodly/inferno/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["inferno_gui*"]

[tool.setuptools.package-data]
"*" = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP006", "UP007"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false